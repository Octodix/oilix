services:
  postgres:
    image: postgres:16-alpine
    container_name: oilix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oilix
      POSTGRES_PASSWORD: oilix_secret
      POSTGRES_DB: oilix
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
